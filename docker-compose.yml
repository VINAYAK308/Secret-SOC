version: "3.9"

networks:
  soc-network:
    driver: bridge
    name: secret-soc-python-network

volumes:
  postgres_data:
    name: secret-soc-python-postgres-data

services:
  db:
    image: postgres:16-alpine
    container_name: secret-soc-python-db
    restart: unless-stopped
    networks:
      - soc-network
    environment:
      POSTGRES_USER: ${PG_USER:-secretscan}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-bmcAdm1n@123}
      POSTGRES_DB: ${PG_DATABASE:-secrets_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5433}:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-secretscan} -d ${PG_DATABASE:-secrets_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: secret-soc-python-app
    restart: unless-stopped
    networks:
      - soc-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5002
      PG_HOST: db
      PG_PORT: 5433
      PG_USER: ${PG_USER:-secretscan}
      PG_PASSWORD: ${PG_PASSWORD:-bmcAdm1n@123}
      PG_DATABASE: ${PG_DATABASE:-secrets_db}
      JWT_SECRET: ${JWT_SECRET:-7fK9@xL2pQ8vN5$mR1zT6&wY3uA0bC}
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
