version: "3.9"

# App only — PostgreSQL must run on the host (see .env). No Docker database service.

networks:
  soc-network:
    driver: bridge
    name: secret-soc-python-network

services:
  app:
    build: .
    container_name: secret-soc-python-app
    restart: unless-stopped
    env_file: .env
    networks:
      - soc-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${PORT:-5002}
      # Reach host Postgres from inside the container (overrides localhost in .env)
      PG_HOST: host.docker.internal
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-secretscan}
      PG_PASSWORD: ${PG_PASSWORD:-bmcAdm1n@123}
      PG_DATABASE: ${PG_DATABASE:-secrets_db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
