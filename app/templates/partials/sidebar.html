<div id="sidebar-backdrop" class="sidebar-backdrop is-hidden" aria-hidden="true" style="pointer-events:none;"></div>

<aside id="sidebar" class="sidebar" aria-label="Main navigation">
  <div class="sidebar__glow" aria-hidden="true"></div>

  <button type="button" id="sidebar-brand" class="sidebar__brand" title="Collapse sidebar">
    <span class="sidebar__logo brand-logo" aria-hidden="true">{% include "partials/brand-lock-icon.html" %}</span>
    <h1 class="sidebar__title sidebar-label">Secret SOC</h1>
  </button>

  <nav class="sidebar__nav" aria-label="Pages">
    <a href="/dashboard" class="nav-link {% if active_page == 'dashboard' %}nav-link--active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      <span class="sidebar-label">Dashboard</span>
    </a>
    <a href="/findings" class="nav-link {% if active_page == 'findings' %}nav-link--active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="sidebar-label">Findings</span>
    </a>
    <a href="/repositories" class="nav-link {% if active_page == 'repositories' %}nav-link--active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
      <span class="sidebar-label">Repositories</span>
    </a>
    <a href="/alerts" class="nav-link {% if active_page == 'alerts' %}nav-link--active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="sidebar-label">Alert Queue</span>
    </a>
    <a href="/scan" class="nav-link {% if active_page == 'scan' %}nav-link--active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      <span class="sidebar-label">Trigger Scan</span>
    </a>
    <a href="/users" class="nav-link nav-link--admin {% if active_page == 'users' %}nav-link--active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="sidebar-label">User Management</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <button id="theme-toggle" type="button" class="sidebar-footer-btn" data-theme-toggle title="Switch Theme">
      <span id="theme-icon" data-theme-icon aria-hidden="true" style="flex-shrink: 0; display: block; line-height: 1;"></span>
      <span id="theme-label" class="sidebar-label" data-theme-label>Light</span>
    </button>
    <button id="logout-btn" type="button" class="sidebar-footer-btn" title="Sign out">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      <span class="sidebar-label">Sign out</span>
    </button>
  </div>
</aside>
